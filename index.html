<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Downloader HD</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 640px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
    }
    h1 {
      text-align: center;
      color: #fff;
      font-size: 28px;
      margin-bottom: 10px;
      font-weight: 700;
    }
    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
      font-size: 14px;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }
    input {
      flex: 1;
      padding: 15px 20px;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: all 0.3s;
    }
    input::placeholder {
      color: #888;
    }
    input:focus {
      border-color: #fe2c55;
      background: rgba(255,255,255,0.1);
    }
    button {
      padding: 15px 25px;
      background: #fe2c55;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: all 0.3s;
      white-space: nowrap;
    }
    button:hover {
      background: #e0244f;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(254,44,85,0.4);
    }
    button:disabled {
      background: #666;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    #result {
      margin-top: 20px;
      color: #fff;
    }
    .card {
      background: rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      animation: fadeIn 0.5s;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .author {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    .author img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 2px solid #fe2c55;
      object-fit: cover;
    }
    .author-info {
      display: flex;
      flex-direction: column;
    }
    .author-name {
      font-weight: bold;
      font-size: 15px;
    }
    .author-username {
      font-size: 12px;
      color: #aaa;
    }
    .title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #fff;
      word-break: break-word;
    }
    .cover-container {
      position: relative;
      margin-bottom: 15px;
    }
    .cover-container img {
      width: 100%;
      max-height: 350px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
    }
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 15px;
    }
    .image-grid img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      transition: transform 0.2s;
      cursor: pointer;
    }
    .image-grid img:hover {
      transform: scale(1.05);
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 15px;
      font-size: 13px;
      color: #ccc;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .download-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background: #fe2c55;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      transition: all 0.3s;
      cursor: pointer;
    }
    .btn-download:hover {
      background: #e0244f;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(254,44,85,0.4);
    }
    .btn-music {
      background: #25D366;
    }
    .btn-music:hover {
      background: #1eb955;
    }
    .loading {
      text-align: center;
      padding: 30px;
      color: #aaa;
    }
    .spinner {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      border-top-color: #fe2c55;
      animation: spin 0.8s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .error {
      color: #ff6b6b;
      text-align: center;
      padding: 15px;
      background: rgba(255,0,0,0.1);
      border-radius: 10px;
    }
    @media (max-width: 480px) {
      .container { padding: 20px; }
      h1 { font-size: 22px; }
      .input-group { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎵 TikTok Downloader HD</h1>
    <p class="subtitle">Tempel link TikTok, otomatis muncul preview & tombol download HD</p>
    <div class="input-group">
      <input type="text" id="url" placeholder="https://vt.tiktok.com/...">
      <button id="btnDownload" onclick="processUrl()" disabled>Download</button>
    </div>
    <div id="result"></div>
  </div>

  <script>
    const urlInput = document.getElementById('url');
    const btnDownload = document.getElementById('btnDownload');
    const resultDiv = document.getElementById('result');
    let debounceTimer;

    urlInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      const url = urlInput.value.trim();
      if (url) {
        btnDownload.disabled = false;
        debounceTimer = setTimeout(() => {
          processUrl();
        }, 800);
      } else {
        btnDownload.disabled = true;
        resultDiv.innerHTML = '';
      }
    });

    urlInput.addEventListener('paste', () => {
      setTimeout(() => {
        const url = urlInput.value.trim();
        if (url) {
          btnDownload.disabled = false;
          processUrl();
        }
      }, 100);
    });

    async function processUrl() {
      const url = urlInput.value.trim();
      if (!url) {
        alert('Masukkan URL TikTok terlebih dahulu');
        return;
      }

      resultDiv.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p>Memproses video...</p>
        </div>
      `;
      btnDownload.disabled = true;

      try {
        const res = await fetch('/api/tiktok', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await res.json();

        if (data.error) {
          resultDiv.innerHTML = `<div class="error">${data.error}</div>`;
          btnDownload.disabled = false;
          return;
        }

        renderResult(data);
      } catch (error) {
        console.error(error);
        resultDiv.innerHTML = `<div class="error">Terjadi kesalahan, coba lagi nanti.</div>`;
      } finally {
        btnDownload.disabled = false;
      }
    }

    function renderResult(data) {
      let html = '<div class="card">';

      // Author
      html += `
        <div class="author">
          <img src="${data.author.avatar}" onerror="this.src='https://via.placeholder.com/150x150?text=No+Avatar'">
          <div class="author-info">
            <span class="author-name">${data.author.name}</span>
            <span class="author-username">@${data.author.name}</span>
          </div>
        </div>
      `;

      // Title
      html += `<div class="title">${escapeHtml(data.title)}</div>`;

      // Cover / thumbnail
      const coverUrl = data.cover || 'https://via.placeholder.com/400x300?text=No+Cover';
      html += `
        <div class="cover-container">
          <img src="${coverUrl}" alt="cover" onerror="this.src='https://via.placeholder.com/400x300?text=No+Cover'">
        </div>
      `;

      // Slide
      if (data.type === 'slide' && data.images && data.images.length > 0) {
        let imagesHtml = '';
        data.images.forEach(img => {
          imagesHtml += `<img src="${img}" alt="slide" onerror="this.src='https://via.placeholder.com/140x180?text=?'">`;
        });
        html += `<div class="image-grid">${imagesHtml}</div>`;
      }

      // Stats
      if (data.stats) {
        html += `
          <div class="stats">
            <span class="stat-item">👁 ${formatNumber(data.stats.views)}</span>
            <span class="stat-item">❤️ ${formatNumber(data.stats.likes)}</span>
            <span class="stat-item">💬 ${formatNumber(data.stats.comments)}</span>
            <span class="stat-item">🔗 ${formatNumber(data.stats.shares)}</span>
          </div>
        `;
      }

      // Download buttons
      html += '<div class="download-buttons">';
      if (data.type === 'video') {
        // PAKSA HD: langsung pakai link HD
        const hdLink = data.video.hd; // sudah hdplay
        const fileName = getDownloadFileName(data);
        html += `<a href="${hdLink}" download="${fileName}" target="_blank" class="btn-download">⬇ Download Video HD</a>`;
      } else {
        // Slide: tombol musik
        if (data.music) {
          html += `<a href="${data.music}" download="${getMusicFileName(data)}" target="_blank" class="btn-download btn-music">🎵 Download Musik</a>`;
        }
      }
      // Musik untuk video
      if (data.type === 'video' && data.music) {
        html += `<a href="${data.music}" download="${getMusicFileName(data)}" target="_blank" class="btn-download btn-music">🎵 Download Musik</a>`;
      }
      html += '</div>';

      html += '</div>';
      resultDiv.innerHTML = html;
    }

    function formatNumber(num) {
      if (!num) return '0';
      return Number(num).toLocaleString('id-ID');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function sanitizeFileName(name) {
      return name.replace(/[\\/:*?"<>|]/g, '').trim().replace(/\s+/g, '_').slice(0, 80);
    }

    function getDownloadFileName(data) {
      const base = data.title && data.title !== 'Tanpa Judul' 
        ? sanitizeFileName(data.title) 
        : `TikTok_${Date.now()}`;
      return `${base}.mp4`;
    }

    function getMusicFileName(data) {
      const base = data.title && data.title !== 'Tanpa Judul' 
        ? sanitizeFileName(data.title) 
        : `TikTok_${Date.now()}`;
      return `${base}_music.mp3`;
    }
  </script>
</body>
</html>
